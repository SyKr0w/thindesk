<div class="container-fluid" th:fragment="content" xmlns:th="http://www.thymeleaf.org">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h2>Dashboard</h2>
            <p th:text="'Bem-vindo, ' + ${nome}">Bem-vindo</p>
        </div>
        <img th:src="@{/images/logo.png}" alt="Logo" width="100">
    </div>

    <form th:action="@{/}" method="get" class="row g-3 align-items-end mb-4">
        <div class="col-sm-6 col-md-3">
            <label for="dataInicio" class="form-label">De</label>
            <input type="date" id="dataInicio" name="dataInicio" class="form-control" th:value="${dataInicio}">
        </div>
        <div class="col-sm-6 col-md-3">
            <label for="dataFim" class="form-label">Até</label>
            <input type="date" id="dataFim" name="dataFim" class="form-control" th:value="${dataFim}">
        </div>
        <div class="col-sm-6 col-md-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" name="status" class="form-select">
                <option value="TODOS" th:selected="${status == 'TODOS'}">Todos</option>
                <option value="ABERTO" th:selected="${status == 'ABERTO'}">Abertos</option>
                <option value="RESOLVIDO" th:selected="${status == 'RESOLVIDO'}">Resolvidos</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Filtrar</button>
            <a th:href="@{/}" class="btn btn-outline-secondary">Limpar</a>
        </div>
    </form>
    <div th:if="${erroFiltro != null}" th:text="${erroFiltro}" class="alert alert-warning"></div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Total de chamados</h5>
                    <h2 th:text="${total}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Chamados abertos</h5>
                    <h2 class="text-warning" th:text="${abertos}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Chamados resolvidos</h5>
                    <h2 class="text-success" th:text="${resolvidos}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h4>Chamados recentes</h4>
        <a th:href="@{/chamados/novo}" class="btn btn-primary btn-sm">Novo chamado</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Título</th>
                    <th>Status</th>
                    <th>Usuário</th>
                    <th>Data de abertura</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="chamado : ${recentes}">
                    <td th:text="${chamado.titulo}"></td>
                    <td th:text="${chamado.status}"></td>
                    <td th:text="${chamado.solicitanteNome}"></td>
                    <td th:text="${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><a th:href="@{/chamados/{id}(id=${chamado.id})}" class="btn btn-primary btn-sm">Detalhes</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentes)}">
                    <td colspan="5" class="text-center">Nenhum chamado encontrado para os filtros selecionados.</td>
                </tr>
            </tbody>
        </table>
    </div>
    <a th:href="@{/chamados}">Ver todos os chamados</a>
</div>
