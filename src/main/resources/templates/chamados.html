<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Chamados</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main id="content" class="container-fluid mt-4">
            <div class="container-fluid" th:fragment="content">
                <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                    <h2 class="mb-0" sec:authorize="hasRole('USER')">Meus chamados</h2>
                    <h2 class="mb-0" sec:authorize="hasAnyRole('MODERATOR','ADMIN')">Lista de Chamados</h2>
                    <a th:href="@{/chamados/novo}" class="btn btn-primary btn-sm">Novo chamado</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Título</th>
                                <th>Descrição</th>
                                <th>Status</th>
                                <th>Técnico</th>
                                <th>Usuário</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <th:block th:each="chamado : ${chamados}">
                                <tr>
                                    <td th:text="${chamado.titulo}"></td>
                                    <td class="descricao-chamado" th:text="${chamado.descricao}"></td>
                                    <td th:text="${chamado.status}"></td>
                                    <td th:text="${chamado.tecnicoNome != null ? chamado.tecnicoNome : '-'}"></td>
                                    <td th:text="${chamado.solicitanteNome}"></td>
                                    <td>
                                        <a th:href="@{/chamados/{id}(id=${chamado.id})}" class="btn btn-primary btn-sm">Detalhes</a>
                                    </td>
                                </tr>
                            </th:block>
                            <tr th:if="${#lists.isEmpty(chamados)}">
                                <td colspan="6" class="text-center">Nenhum chamado registrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
