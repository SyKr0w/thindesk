<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
</head>
<body>
 
    <h1>Criar conta</h1>
 
    <p th:if="${erro}" th:text="${erro}"></p>
 
    <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
 
        <div>
            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                th:field="*{nome}"
                required>
        </div>
 
        <div>
            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                th:field="*{email}"
                required>
        </div>
 
        <div>
            <label for="senha">Senha:</label>
            <input
                type="password"
                id="senha"
                th:field="*{senha}"
                required>
        </div>
 
        <button type="submit">Cadastrar</button>
 
    </form>
 
    <p>
        Já possui uma conta?
        <a th:href="@{/login}">Entrar</a>
    </p>
 
</body>
</html>
