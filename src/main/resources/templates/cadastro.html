<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>Cadastro de Usuário</title>

    <!-- Link para o CSS do Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">

    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }

        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 1rem;
        }

        .form-group {
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card text-center">

            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">

            <h3 class="mb-4">Criar conta</h3>

            <p th:if="${erro}"
               th:text="${erro}"
               class="text-danger"></p>

            <form th:action="@{/cadastro}"
                  th:object="${usuario}"
                  method="post">

                <div class="form-group mb-3">

                    <label for="nome" class="form-label">Nome</label>

                    <input type="text" class="form-control" id="nome" th:field="*{nome}" placeholder="Digite seu nome" required>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}">
                    </div>

                </div>

                <div class="form-group mb-3">

                    <label for="email" class="form-label">E-mail</label>

                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Digite seu e-mail" required>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>

                </div>

                <div class="form-group mb-3">

                    <label for="senha" class="form-label">Senha</label>

                    <input type="password" class="form-control" id="senha" th:field="*{senha}" placeholder="Digite sua senha" required>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('senha')}"
                         th:errors="*{senha}">
                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Cadastrar
                </button>

            </form>

            <div class="mt-3">
                <p>
                    Já possui uma conta?
                    <a th:href="@{/login}">Entrar</a>
                </p>
            </div>

        </div>

    </div>

    <!-- Link para o JS do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
