<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar">
                <h4 class="text-center py-3">Thindesk Menu</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/chamados}">
                            <i class="bi bi-headset"></i> <span>Chamados</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/chamados/novo}">
                            <i class="bi bi-plus-circle"></i> <span>Novo chamado</span>
                        </a>
                    </li>
                    <li class="nav-item px-3 mt-3" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="btn btn-danger w-100">Sair</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
