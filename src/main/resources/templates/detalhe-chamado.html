<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detalhes do Chamado</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main id="content" class="container-fluid mt-4">
            <div class="container-fluid">
                <h2 class="mb-4">Detalhes do chamado</h2>
                <div th:if="${param.criado}" class="alert alert-success">Chamado registrado com sucesso.</div>
                <div th:if="${param.resolvido}" class="alert alert-success">Chamado resolvido com sucesso.</div>
                <div class="card mb-4">
                    <div class="card-body">
                        <h4 class="card-title" th:text="${chamado.titulo}"></h4>
                        <p><strong>Status:</strong> <span th:text="${chamado.status}"></span></p>
                        <p><strong>Usuário:</strong> <span th:text="${chamado.solicitanteNome}"></span></p>
                        <p><strong>Data de abertura:</strong> <span th:text="${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')}"></span></p>
                        <p><strong>Descrição:</strong></p>
                        <p class="descricao-chamado" th:text="${chamado.descricao}"></p>
                        <div th:if="${chamado.status.name() == 'RESOLVIDO'}">
                            <hr>
                            <p><strong>Técnico:</strong> <span th:text="${chamado.tecnicoNome}"></span></p>
                            <p><strong>Data de resolução:</strong> <span th:text="${#temporals.format(chamado.dataResolucao, 'dd/MM/yyyy HH:mm')}"></span></p>
                            <p><strong>Solução:</strong></p>
                            <p class="descricao-chamado" th:text="${chamado.solucao}"></p>
                        </div>
                    </div>
                </div>
                <div sec:authorize="hasAnyRole('MODERATOR','ADMIN')" th:if="${chamado.status.name() == 'ABERTO'}">
                    <h4>Resolver chamado</h4>
                    <form th:action="@{/chamados/{id}/resolver(id=${chamado.id})}" th:object="${solucaoChamado}" method="post">
                        <div class="mb-3">
                            <label for="solucao" class="form-label">Solução aplicada</label>
                            <textarea id="solucao" class="form-control" th:field="*{solucao}" rows="5" maxlength="2000" required></textarea>
                            <div class="text-danger" th:if="${#fields.hasErrors('solucao')}" th:errors="*{solucao}"></div>
                        </div>
                        <button type="submit" class="btn btn-success">Resolver chamado</button>
                    </form>
                </div>
                <a th:href="@{/chamados}" class="btn btn-secondary mt-3">Voltar</a>
            </div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
